import groovy.json.JsonOutput

plugins {
    id 'com.android.application'
}

def localConfig = new Properties()
def localConfigFile = rootProject.file('local.properties')
if (localConfigFile.exists()) {
    localConfigFile.withInputStream { input ->
        localConfig.load(input)
    }
}
def signingProperties = new Properties()
def signingFile = rootProject.file('release-signing.properties')
if (signingFile.exists()) {
    signingFile.withInputStream { input ->
        signingProperties.load(input)
    }
}

def receiptToken = providers.environmentVariable('FNS_TOKEN')
        .orElse(providers.provider { localConfig.getProperty('fns.token', '') })

android {
    namespace 'ru.checkscan.app'
    compileSdk 36

    defaultConfig {
        applicationId 'ru.checkscan.app'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
        buildConfigField 'String', 'FNS_TOKEN', JsonOutput.toJson(receiptToken.get())
    }

    signingConfigs {
        release {
            if (signingFile.exists()) {
                storeFile rootProject.file('release-key.jks')
                storePassword signingProperties.getProperty('storePassword')
                keyAlias 'checkscan'
                keyPassword signingProperties.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.camera:camera-camera2:1.4.2'
    implementation 'androidx.camera:camera-lifecycle:1.4.2'
    implementation 'androidx.camera:camera-view:1.4.2'
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'

    testImplementation 'junit:junit:4.13.2'
}
